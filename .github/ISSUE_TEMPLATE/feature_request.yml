name: Feature request
description: Propose a broadly useful numerical or developer-experience improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Numerus prioritizes small, composable numerical primitives with clear contracts. Requests for model-specific estimators or speculative features may be out of scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What concrete user problem or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful capability and how a caller would use it.
    validations:
      required: true
  - type: textarea
    id: generality
    attributes:
      label: General use case
      description: Explain why this belongs in a general-purpose numerical extension rather than a model-specific package.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: Include existing primitives that could already express the workflow and any numerical or compatibility trade-offs.
    validations:
      required: false
