            -o tests/matrix_statistics_test tests/matrix_statistics_test.c src/matrix/numerus_matrix_statistics.c src/matrix/numerus_matrix.c src/matrix/numerus_matrix_view_nodes.c src/matrix/numerus_matrix_constructors.c src/storage/numerus_storage.c src/matrix/numerus_matrix_lu.c -lm
