          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/matrix_elementwise_test tests/matrix_elementwise_test.c numerus_matrix_elementwise.c numerus_matrix.c numerus_storage.c numerus_matrix_lu.c -lm
          ./tests/matrix_elementwise_test

      - name: Run native Matrix map/apply tests
