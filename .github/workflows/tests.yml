  debug:
    name: Debug build
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf build-essential pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build system
        run: phpize

      - name: Configure debug build
        env:
          CFLAGS: -g -O0
        run: ./configure --enable-numerus

      - name: Build
        run: make -j"$(nproc)"

      - name: Run extension tests
        run: make test TESTS='tests/*.phpt'
