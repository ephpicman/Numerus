name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf build-essential pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build system
        run: phpize

      - name: Configure
        run: ./configure --enable-numerus

      - name: Build
        run: make -j"$(nproc)"

      - name: Run native storage tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/storage_test tests/storage_test.c numerus_storage.c
          ./tests/storage_test

      - name: Run native Matrix tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/matrix_test tests/matrix_test.c numerus_matrix.c numerus_storage.c numerus_matrix_lu.c
          ./tests/matrix_test

      - name: Run native Matrix unary operation tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/matrix_unary_test tests/matrix_unary_test.c numerus_matrix.c numerus_storage.c numerus_matrix_lu.c
          ./tests/matrix_unary_test

      - name: Run native Matrix binary operation tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/matrix_binary_test tests/matrix_binary_test.c numerus_matrix.c numerus_matrix_binary.c numerus_storage.c numerus_matrix_lu.c
          ./tests/matrix_binary_test

      - name: Run native Matrix element-wise min/max/clamp tests
