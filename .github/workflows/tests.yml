name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf build-essential pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build system
        run: phpize

      - name: Configure
        run: ./configure --enable-numerus

      - name: Build
        run: make -j"$(nproc)"

      - name: Check Matrix headers independently
        run: sh tests/check_matrix_headers.sh

      - name: Run native RNG state tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_RNG_TEST_ALLOCATOR \
            -o tests/rng_state_test tests/rng_state_test.c src/statistics/numerus_rng.c -lm
          ./tests/rng_state_test

      - name: Run native RNG variate tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_RNG_USE_LIBC_ALLOC \
            -o tests/rng_variates_test tests/rng_variates_test.c src/statistics/numerus_rng.c -lm
          ./tests/rng_variates_test

      - name: Run native RNG sampling tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_RNG_TEST_ALLOCATOR \
            -o tests/rng_sampling_test tests/rng_sampling_test.c src/statistics/numerus_rng.c src/statistics/numerus_rng_sampling.c -lm
          ./tests/rng_sampling_test

      - name: Run native stable scalar numerical tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -o tests/numeric_stable_functions_test tests/numeric_stable_functions_test.c src/core/numerus_numeric.c -lm
          ./tests/numeric_stable_functions_test

      - name: Run native generic optimizer tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_OPTIMIZER_TEST_ALLOCATOR \
            -o tests/optimizer_test tests/optimizer_test.c src/statistics/numerus_optimizer.c -lm
          ./tests/optimizer_test
      - name: Run native Gaussian log-density tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -DNUMERUS_PROBABILITY_TEST_ALLOCATOR \
            -DNUMERUS_RNG_USE_LIBC_ALLOC \
            -o tests/gaussian_log_density_test tests/gaussian_log_density_test.c src/statistics/numerus_probability.c src/statistics/numerus_rng.c src/matrix/numerus_matrix_cholesky.c src/matrix/numerus_matrix_solve_triangular.c src/matrix/numerus_matrix_log_determinant.c src/matrix/numerus_matrix_solve.c src/matrix/numerus_matrix_inverse.c src/matrix/numerus_matrix_analysis.c src/matrix/numerus_matrix_lu.c src/matrix/numerus_matrix.c src/matrix/numerus_matrix_view_nodes.c src/matrix/numerus_matrix_constructors.c src/storage/numerus_storage.c -lm
          ./tests/gaussian_log_density_test
      - name: Run native Gaussian sampling tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -DNUMERUS_RNG_USE_LIBC_ALLOC \
            -DNUMERUS_PROBABILITY_TEST_ALLOCATOR \
            -o tests/gaussian_sampling_test tests/gaussian_sampling_test.c src/statistics/numerus_probability.c src/statistics/numerus_rng.c src/matrix/numerus_matrix_cholesky.c src/matrix/numerus_matrix_solve_triangular.c src/matrix/numerus_matrix_log_determinant.c src/matrix/numerus_matrix_solve.c src/matrix/numerus_matrix_inverse.c src/matrix/numerus_matrix_analysis.c src/matrix/numerus_matrix_lu.c src/matrix/numerus_matrix.c src/matrix/numerus_matrix_view_nodes.c src/matrix/numerus_matrix_constructors.c src/storage/numerus_storage.c -lm
          ./tests/gaussian_sampling_test

      - name: Run native storage tests
        run: |
          cc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/storage_test tests/storage_test.c src/storage/numerus_storage.c
