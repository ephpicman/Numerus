            -o tests/matrix_binary_test tests/matrix_binary_test.c src/matrix/numerus_matrix.c src/matrix/numerus_matrix_view_nodes.c src/matrix/numerus_matrix_constructors.c src/matrix/numerus_matrix_binary.c src/storage/numerus_storage.c src/matrix/numerus_matrix_lu.c
