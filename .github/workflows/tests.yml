            -o tests/matrix_structural_predicate_test tests/matrix_structural_predicate_test.c numerus_matrix.c numerus_matrix_analysis.c numerus_storage.c numerus_matrix_lu.c -lm
          ./tests/matrix_structural_predicate_test

      - name: Run non-gating Matrix benchmarks
        if: matrix.php == '8.5'
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -Wl,--wrap=malloc -Wl,--wrap=calloc -Wl,--wrap=free \
            -o benchmarks/matrix_benchmark benchmarks/matrix_benchmark.c numerus_matrix.c numerus_matrix_binary.c numerus_matrix_materialize.c numerus_matrix_multiply.c numerus_matrix_analysis.c numerus_matrix_inverse.c numerus_matrix_condition.c numerus_storage.c numerus_matrix_lu.c -lm
          ./benchmarks/matrix_benchmark

      - name: Run Matrix allocation-failure tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -Wl,--wrap=malloc -Wl,--wrap=calloc -Wl,--wrap=free \
            -o tests/matrix_allocation_failure_test tests/matrix_allocation_failure_test.c numerus_matrix.c numerus_storage.c numerus_matrix_lu.c
          ./tests/matrix_allocation_failure_test

      - name: Run adversarial Matrix numerical tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/matrix_adversarial_test tests/matrix_adversarial_test.c numerus_matrix.c numerus_matrix_analysis.c numerus_matrix_statistics.c numerus_storage.c numerus_matrix_lu.c -lm
          ./tests/matrix_adversarial_test

      - name: Run Matrix algebra property tests
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/matrix_property_test tests/matrix_property_test.c numerus_matrix.c numerus_matrix_binary.c numerus_matrix_materialize.c numerus_matrix_multiply.c numerus_matrix_views.c numerus_storage.c numerus_matrix_lu.c -lm
          ./tests/matrix_property_test

      - name: Run Matrix algebra properties with AddressSanitizer and UBSan
        run: |
          cc -std=c11 -g -O1 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
            -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
            -o tests/matrix_property_sanitized tests/matrix_property_test.c numerus_matrix.c numerus_matrix_binary.c numerus_matrix_materialize.c numerus_matrix_multiply.c numerus_matrix_views.c numerus_storage.c numerus_matrix_lu.c -lm
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 ./tests/matrix_property_sanitized

      - name: Run extension tests
        run: make test TESTS='tests/*.phpt'

      - name: Verify extension loads
        run: php -d extension="$(pwd)/modules/numerus.so" -r 'var_dump(extension_loaded("numerus"));'

  debug:
    name: Debug build
    runs-on: ubuntu-latest

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf build-essential pkg-config

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build system
        run: phpize

      - name: Configure debug build
        env:
          CFLAGS: -g -O0
        run: ./configure --enable-numerus

      - name: Build
        run: make -j"$(nproc)"

      - name: Run extension tests
        run: make test TESTS='tests/*.phpt'
