name: Native coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native-coverage:
    name: Native line and branch coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc gcovr

      - name: Build and run instrumented native tests
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/numerus-coverage"
          mkdir -p "$build_root"

          compile_and_run() {
            local name="$1"
            shift
            local build_dir="$build_root/$name"
            mkdir -p "$build_dir"
            local objects=()
            local source
            local object

            for source in "$@"; do
              object="$build_dir/$(basename "$source" .c).o"
              gcc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics \
                -std=c11 -O0 -g --coverage -fprofile-abs-path \
                -Wall -Wextra -Wpedantic -Werror \
                -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
                -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
                -DNUMERUS_PROBABILITY_USE_LIBC_ALLOC \
                -DNUMERUS_RNG_USE_LIBC_ALLOC \
                -DNUMERUS_OPTIMIZER_USE_LIBC_ALLOC \
                -c "$source" -o "$object"
              objects+=("$object")
            done

            gcc --coverage "${objects[@]}" -lm -o "$build_dir/$name"
            "$build_dir/$name"
          }

          compile_and_run storage \
            tests/storage_test.c \
            src/storage/numerus_storage.c

          compile_and_run matrix-property \
            tests/matrix_property_test.c \
            src/matrix/numerus_matrix.c \
            src/matrix/numerus_matrix_view_nodes.c \
            src/matrix/numerus_matrix_constructors.c \
            src/matrix/numerus_matrix_binary.c \
            src/matrix/numerus_matrix_materialize.c \
            src/matrix/numerus_matrix_multiply.c \
            src/matrix/numerus_matrix_views.c \
            src/storage/numerus_storage.c \
            src/matrix/numerus_matrix_lu.c

          compile_and_run matrix-adversarial \
            tests/matrix_adversarial_test.c \
            src/matrix/numerus_matrix.c \
            src/matrix/numerus_matrix_view_nodes.c \
            src/matrix/numerus_matrix_constructors.c \
            src/matrix/numerus_matrix_analysis.c \
            src/matrix/numerus_matrix_statistics.c \
            src/storage/numerus_storage.c \
            src/matrix/numerus_matrix_lu.c

          compile_and_run statistical-property \
            tests/statistical_property_test.c \
            src/core/numerus_numeric.c \
            src/statistics/numerus_optimizer.c \
            src/statistics/numerus_probability.c \
            src/statistics/numerus_rng.c \
            src/statistics/numerus_rng_sampling.c \
            src/matrix/numerus_matrix_cholesky.c \
            src/matrix/numerus_matrix_solve_triangular.c \
            src/matrix/numerus_matrix_log_determinant.c \
            src/matrix/numerus_matrix_solve.c \
            src/matrix/numerus_matrix_inverse.c \
            src/matrix/numerus_matrix_analysis.c \
            src/matrix/numerus_matrix_lu.c \
            src/matrix/numerus_matrix.c \
            src/matrix/numerus_matrix_view_nodes.c \
            src/matrix/numerus_matrix_constructors.c \
            src/storage/numerus_storage.c

      - name: Generate line and branch coverage reports
        run: |
          mkdir -p coverage
          gcovr \
            --root "$GITHUB_WORKSPACE" \
            --filter '.*/src/.*' \
            --object-directory "$RUNNER_TEMP/numerus-coverage" \
            --branches \
            --txt coverage/summary.txt \
            --xml-pretty --xml coverage/coverage.xml \
            --html-details coverage/index.html
          cat coverage/summary.txt

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ github.event_name }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
