name: Native coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native-coverage:
    name: Native line and branch coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc gcovr

      - name: Build and run instrumented native tests
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/numerus-coverage"
          object_dir="$build_root/objects"
          test_dir="$build_root/tests"
          mkdir -p "$object_dir" "$test_dir"
          source_objects=()

          while IFS= read -r -d '' source; do
            object_name="${source//\//_}"
            object="$object_dir/${object_name%.c}.o"
            gcc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics \
              -std=c11 -O0 -g --coverage -fprofile-abs-path \
              -Wall -Wextra -Wpedantic -Werror \
              -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
              -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
              -DNUMERUS_PROBABILITY_USE_LIBC_ALLOC \
              -DNUMERUS_RNG_USE_LIBC_ALLOC \
              -DNUMERUS_OPTIMIZER_USE_LIBC_ALLOC \
              -c "$source" -o "$object"
            source_objects+=("$object")
          done < <(find src -name '*.c' ! -path 'src/numerus.c' -print0 | sort -z)

          if (("${#source_objects[@]}" == 0)); then
            echo "::error::No native source files were instrumented."
            exit 1
          fi

          compile_suite() {
            local name="$1"
            local source="$2"
            gcc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics \
              -std=c11 -O0 -g --coverage -fprofile-abs-path \
              -Wall -Wextra -Wpedantic -Werror \
              -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
              -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
              -DNUMERUS_PROBABILITY_USE_LIBC_ALLOC \
              -DNUMERUS_RNG_USE_LIBC_ALLOC \
              -DNUMERUS_OPTIMIZER_USE_LIBC_ALLOC \
              -Dmain="numerus_coverage_${name}_main" \
              -c "$source" -o "$test_dir/$name.o"
          }

          compile_suite storage tests/storage_test.c
          compile_suite matrix_property tests/matrix_property_test.c
          compile_suite matrix_adversarial tests/matrix_adversarial_test.c
          compile_suite statistical_property tests/statistical_property_test.c

          gcc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics \
            -std=c11 -O0 -g --coverage -fprofile-abs-path \
            -Wall -Wextra -Wpedantic -Werror \
            -c tests/coverage_driver.c -o "$test_dir/coverage_driver.o"

          gcc --coverage "${source_objects[@]}" \
            "$test_dir/storage.o" \
            "$test_dir/matrix_property.o" \
            "$test_dir/matrix_adversarial.o" \
            "$test_dir/statistical_property.o" \
            "$test_dir/coverage_driver.o" -lm -o "$build_root/native-coverage"
          "$build_root/native-coverage"

      - name: Generate and validate line and branch coverage reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          gcovr \
            --root "$GITHUB_WORKSPACE" \
            --filter 'src/' \
            --gcov-object-directory "$RUNNER_TEMP/numerus-coverage/objects" \
            --txt coverage/summary.txt \
            --xml-pretty --xml coverage/coverage.xml \
            --html-details coverage/index.html
          cat coverage/summary.txt

          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage/coverage.xml").getroot()
          lines_valid = int(root.attrib.get("lines-valid", "0"))
          lines_covered = int(root.attrib.get("lines-covered", "0"))
          branches_valid = int(root.attrib.get("branches-valid", "0"))
          branches_covered = int(root.attrib.get("branches-covered", "0"))
          source_files = root.findall(".//class")

          if not source_files:
              sys.exit("::error::Coverage report contains no source files.")
          if lines_valid == 0:
              sys.exit("::error::Coverage report contains no executable source lines.")
          if lines_covered == 0:
              sys.exit("::error::Coverage report contains no covered source lines.")
          if branches_valid == 0:
              sys.exit("::error::Coverage report contains no branch data.")
          if branches_covered == 0:
              sys.exit("::error::Coverage report contains no covered branches.")

          line_percent = 100 * lines_covered / lines_valid
          branch_percent = 100 * branches_covered / branches_valid
          print(
              f"Line coverage: {lines_covered}/{lines_valid} "
              f"({line_percent:.2f}%; {lines_valid - lines_covered} uncovered)"
          )
          print(
              f"Branch coverage: {branches_covered}/{branches_valid} "
              f"({branch_percent:.2f}%; {branches_valid - branches_covered} uncovered)"
          )
          print(f"Coverage includes {len(source_files)} source files.")
          PY

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ github.event_name }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
