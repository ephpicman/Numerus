name: Native coverage

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native-coverage:
    name: Native line and branch coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc gcovr

      - name: Build and run all instrumented native test suites
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/numerus-coverage"
          object_dir="$build_root/objects"
          test_dir="$build_root/tests"
          mkdir -p "$object_dir" "$test_dir"
          source_objects=()

          while IFS= read -r -d '' source; do
            object_name="${source//\//_}"
            object="$object_dir/${object_name%.c}.o"
            gcc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics \
              -std=c11 -O0 -g --coverage -fprofile-abs-path \
              -Wall -Wextra -Wpedantic -Werror \
              -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
              -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
              -DNUMERUS_PROBABILITY_USE_LIBC_ALLOC \
              -DNUMERUS_RNG_USE_LIBC_ALLOC \
              -DNUMERUS_OPTIMIZER_USE_LIBC_ALLOC \
              -c "$source" -o "$object"
            source_objects+=("$object")
          done < <(find src -name '*.c' ! -path 'src/numerus.c' -print0 | sort -z)

          suite_count=0
          while IFS= read -r -d '' source; do
            filename="$(basename "$source")"
            name="${filename%_test.c}"
            test_object="$test_dir/$name.o"
            test_binary="$test_dir/$name"

            gcc -Isrc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics \
              -std=c11 -O0 -g --coverage -fprofile-abs-path \
              -Wall -Wextra -Wpedantic -Werror \
              -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
              -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
              -DNUMERUS_PROBABILITY_USE_LIBC_ALLOC \
              -DNUMERUS_RNG_USE_LIBC_ALLOC \
              -DNUMERUS_OPTIMIZER_USE_LIBC_ALLOC \
              -c "$source" -o "$test_object"

            suite_source_objects=()
            variant_source=""
            variant_macro=""

            case "$name" in
              gaussian_log_density|gaussian_sampling)
                variant_source="src/statistics/numerus_probability.c"
                variant_macro="NUMERUS_PROBABILITY_TEST_ALLOCATOR"
                ;;
              rng_sampling|rng_state)
                variant_source="src/statistics/numerus_rng.c"
                variant_macro="NUMERUS_RNG_TEST_ALLOCATOR"
                ;;
              optimizer)
                variant_source="src/statistics/numerus_optimizer.c"
                variant_macro="NUMERUS_OPTIMIZER_TEST_ALLOCATOR"
                ;;
            esac

            for object in "${source_objects[@]}"; do
              case "$name:$object" in
                gaussian_log_density:*/src_statistics_numerus_probability.o|gaussian_sampling:*/src_statistics_numerus_probability.o|rng_sampling:*/src_statistics_numerus_rng.o|rng_state:*/src_statistics_numerus_rng.o|optimizer:*/src_statistics_numerus_optimizer.o)
                  continue
                  ;;
              esac
              suite_source_objects+=("$object")
            done

            if [[ -n "$variant_source" ]]; then
              variant_object="$object_dir/variants/$name.o"
              mkdir -p "$object_dir/variants"
              gcc -Isrc/core -Isrc/storage -Isrc/matrix -Isrc/statistics \
                -std=c11 -O0 -g --coverage -fprofile-abs-path \
                -Wall -Wextra -Wpedantic -Werror \
                -DNUMERUS_MATRIX_USE_LIBC_ALLOC \
                -DNUMERUS_STORAGE_USE_LIBC_ALLOC \
                -DNUMERUS_PROBABILITY_USE_LIBC_ALLOC \
                -DNUMERUS_RNG_USE_LIBC_ALLOC \
                -DNUMERUS_OPTIMIZER_USE_LIBC_ALLOC \
                -D"$variant_macro" -c "$variant_source" -o "$variant_object"
              suite_source_objects+=("$variant_object")
            fi

            if [[ "$name" == "matrix_allocation_failure" ]]; then
              gcc --coverage -Wl,--wrap=malloc -Wl,--wrap=calloc -Wl,--wrap=free \
                "${suite_source_objects[@]}" "$test_object" -lm -o "$test_binary"
            else
              gcc --coverage "${suite_source_objects[@]}" "$test_object" -lm -o "$test_binary"
            fi

            echo "::group::Native test suite: $name"
            "$test_binary"
            echo "::endgroup::"
            suite_count=$((suite_count + 1))
          done < <(find tests -maxdepth 1 -type f -name '*_test.c' -print0 | sort -z)

          if [[ "$suite_count" -eq 0 ]]; then
            echo "No native test suites were discovered." >&2
            exit 1
          fi
          echo "All $suite_count native test suites passed under coverage."

      - name: Generate line and branch coverage reports
        run: |
          mkdir -p coverage
          gcovr \
            --root "$GITHUB_WORKSPACE" \
            --filter '.*/src/.*' \
            --object-directory "$RUNNER_TEMP/numerus-coverage" \
            --branches \
            --txt coverage/summary.txt \
            --xml-pretty --xml coverage/coverage.xml \
            --html-details coverage/index.html
          cat coverage/summary.txt

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-${{ github.event_name }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
